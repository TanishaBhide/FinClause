name: person1-extraction-tests

on:
  push:
    paths: ["backend/person1_extraction/**", ".github/workflows/person1-extraction-tests.yml"]
  pull_request:
    paths: ["backend/person1_extraction/**", ".github/workflows/person1-extraction-tests.yml"]

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.12"]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: backend/person1_extraction
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: backend/person1_extraction/requirements.txt
      - name: Install Tesseract (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y tesseract-ocr
      - name: Install Tesseract (Windows)
        if: runner.os == 'Windows'
        run: choco install tesseract -y --no-progress
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .
      - name: Run tests
        run: python -m pytest -q -rs
